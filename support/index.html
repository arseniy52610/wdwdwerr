<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex,nofollow">
  <title>Поддержка — BYNEXVPN</title>
  <link rel="icon" href="../logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="support.css">
</head>
<body class="sp-page">
  <div class="sp" id="spRoot">

    <header class="sp__top">
      <a class="sp__back" href="/" data-no-track aria-label="На главную">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>

      <div class="sp__ava" aria-hidden="true">
        <img src="../logo.png" alt="">
        <i class="sp__dot js-dot"></i>
      </div>

      <div class="sp__id">
        <div class="sp__ttl">
          Техническая поддержка
          <svg class="sp__badge" viewBox="0 0 24 24" fill="currentColor" aria-label="Подтверждено">
            <path d="M12 1.7l2.45 1.8 3.05-.16.9 2.94 2.55 1.73-1.2 2.83 1.2 2.83-2.55 1.73-.9 2.94-3.05-.16L12 22.3l-2.45-1.8-3.05.16-.9-2.94L3.05 15.9l1.2-2.83-1.2-2.83 2.55-1.73.9-2.94 3.05.16L12 1.7z"></path>
            <path d="M8.2 12.3l2.5 2.5 5.1-5.4" fill="none" stroke="#0a0a0c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>
        <div class="sp__status"><i class="sp__dot sp__dot--mini js-dot"></i><span class="js-stat">Проверяем статус…</span></div>
      </div>

      <button type="button" class="sp__menu-btn" id="spMenuBtn" data-no-track aria-label="Меню" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.7"></circle><circle cx="12" cy="12" r="1.7"></circle><circle cx="19" cy="12" r="1.7"></circle></svg>
      </button>

      <div class="sp__menu" id="spMenu" hidden>
        <button type="button" data-info="pricing" data-no-track>Тарифы</button>
        <button type="button" data-info="advantages" data-no-track>Преимущества</button>
        <button type="button" id="spNotifyBtn" data-no-track hidden>Уведомления</button>
        <a href="https://t.me/BynexVPN_news" target="_blank" rel="noopener noreferrer" data-no-track>Telegram-канал</a>
      </div>
    </header>

    <div class="sp__wrap" id="spWrap">

      <div class="sp__empty" id="spEmpty">
        <div class="sp__logo">R&nbsp;&nbsp;BYNEXVPN</div>
        <div class="sp__hello">
          Здравствуйте! 👋<br>
          Это служба поддержки BynexVPN.<br>
          Опишите вашу проблему — мы постараемся помочь.
        </div>
        <div class="sp__quick" id="spQuick"></div>
        <div class="sp__hint">Ответим как можно скорее. Обычно это занимает несколько минут.</div>
      </div>

      <div class="sp__thread" id="spThread" hidden></div>

      <button type="button" class="sp__unread" id="spUnread" hidden data-no-track>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"></path><path d="M19 12l-7 7-7-7"></path></svg>
        <span id="spUnreadN">1</span>&nbsp;новых
      </button>
    </div>

    <div class="sp__foot">
      <div class="sp__closed" id="spClosedBar" hidden>
        <span>Обращение закрыто</span>
        <button type="button" class="sp__closed-btn" id="spNewBtn" data-no-track>Новое обращение</button>
      </div>
      <div class="sp__chip" id="spChip" hidden>
        <span id="spChipText"></span>
        <button type="button" id="spChipX" data-no-track aria-label="Убрать категорию">×</button>
      </div>

      <div class="sp__quickbar" id="spQuickBar" hidden>
        <div class="sp__quick sp__quick--bar" id="spQuick2"></div>
      </div>

      <div class="sp__composer-row">
        <button type="button" class="sp__plus" id="spPlus" data-no-track aria-label="Быстрые темы">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
        </button>
        <form class="sp__composer" id="spForm" autocomplete="off">
          <textarea class="sp__input" id="spText" rows="1" placeholder="Напишите сообщение..." data-no-track></textarea>
          <button class="sp__send" id="spSend" type="submit" data-no-track aria-label="Отправить" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"></path><path d="M22 2l-7 20-4-9-9-4 20-7z"></path></svg>
          </button>
        </form>
      </div>
    </div>

  </div>

  <div class="sp__toast" id="spToast" hidden></div>

  <script src="../supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../analytics.js"></script>
  <script src="support.js"></script>
</body>
</html>
